<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Snowel Web 重构 · 交互 Demo（完整版）</title>
<style>
:root{
  --base:#17181c; --panel:#1e2026; --raised:#262933; --border:#33363f;
  --text:#e8e6e1; --muted:#9a978f; --accent:#e0a04a; --accent-dim:#8a6526;
  --ok:#7fb069; --warn:#d9a13d; --danger:#c96f5f; --info:#6f9fc9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#101114;color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif;font-size:14px;padding-bottom:70px}
/* demo 工具条 */
.dbar{position:sticky;top:0;z-index:99;background:#0c0d10;border-bottom:1px solid var(--border);padding:9px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dbar h1{font-size:14px;color:var(--accent);font-weight:600}
.dbar .sub{color:var(--muted);font-size:12px}
.dbar .sp{flex:1}
.dbtn{background:var(--raised);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.dbtn:hover{color:var(--text)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.dot.g{background:var(--ok)} .dot.y{background:var(--warn)}
/* 通用 */
.page{width:1280px;margin:22px auto 0;background:var(--base);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.btn{border:none;border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px;background:var(--raised);color:var(--text)}
.btn.primary{background:var(--accent);color:#141414;font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tag{display:inline-block;font-size:11px;border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:2px}
.tag.q{background:rgba(217,161,61,.15);color:var(--warn);border:1px solid rgba(217,161,61,.4)}
.tag.new{background:rgba(111,159,201,.15);color:var(--info);border:1px solid rgba(111,159,201,.4)}
.tag.ok2{background:rgba(127,176,105,.12);color:var(--ok);border:1px solid rgba(127,176,105,.35)}
.chip{display:inline-block;border:1px solid var(--border);border-radius:14px;padding:3px 10px;font-size:12px;color:var(--muted);margin:0 6px 6px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--base);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--text);font-size:13px;font-family:inherit}
.field textarea{min-height:100px;resize:vertical;line-height:1.7}
.row{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px}
.card h3{font-size:14px;margin-bottom:4px}
.card .hint{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.testok{display:flex;align-items:center;gap:8px;background:rgba(127,176,105,.12);border:1px solid rgba(127,176,105,.4);color:var(--ok);border-radius:6px;padding:8px 12px;font-size:13px;margin:6px 0 12px}
/* 顶栏 */
.topbar{height:48px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border);position:relative}
.brand{display:flex;align-items:center;gap:8px;font-weight:600}
.brand .b{color:var(--accent)}
.topmid{flex:1;text-align:center;color:var(--muted)}
.topright{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.pill{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px}
/* 项目切换器 */
.pswitch>button{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--border);border-radius:8px;padding:5px 12px;color:var(--text);font-size:14px;font-weight:600;cursor:pointer}
.pmenu{display:none;position:absolute;top:44px;left:12px;width:310px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;box-shadow:0 12px 40px rgba(0,0,0,.6);z-index:60}
.pmenu.on{display:block}
.pmenu .mi{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px}
.pmenu .mi:hover{background:var(--raised)}
.pmenu .mi .meta{font-size:11px;color:var(--muted)}
.pmenu .mi.cur{background:rgba(224,160,74,.08);border:1px solid var(--accent-dim)}
.pmenu .new{border-top:1px solid var(--border);margin-top:8px;padding-top:10px;display:flex;gap:8px}
.pmenu .new input{flex:1;background:var(--base);border:1px solid var(--border);border-radius:6px;padding:6px 9px;color:var(--text);font-size:12px}
.iconbtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);cursor:pointer;font-size:15px}
.iconbtn:hover{color:var(--text);background:var(--raised)}
/* 设置模态 */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.modal.on{display:flex}
.mcard{width:520px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;box-shadow:0 20px 80px rgba(0,0,0,.7)}
.mcard h3{font-size:16px;margin-bottom:4px}
.mcard .hint{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:16px}
/* 向导 */
.wizard{padding:40px 56px;min-height:600px}
.wizard h2{font-size:20px;margin-bottom:6px}
.wizard .lead{color:var(--muted);margin-bottom:26px}
.stepper{display:flex;margin-bottom:28px}
.stepper .s{flex:1;text-align:center;font-size:12px;color:var(--muted);position:relative;padding-top:26px}
.stepper .s::before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:20px;line-height:20px;border-radius:50%;background:var(--raised);border:1px solid var(--border);font-size:11px}
.stepper .s.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:#141414}
.stepper .s.cur{color:var(--accent)}
.stepper .s.cur::before{background:var(--accent);border-color:var(--accent);color:#141414;font-weight:700}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;align-items:start}
.shelf .bi{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer}
.shelf .bi:hover{background:var(--raised)}
.shelf .bi .t{font-size:13px}
.shelf .bi .m{font-size:11px;color:var(--muted);margin-top:2px}
.shelf .bi.cur{border-color:var(--accent-dim);background:rgba(224,160,74,.06)}
.shelf .newb{display:flex;gap:8px;margin-top:12px}
.shelf .newb input{flex:1;background:var(--base);border:1px solid var(--border);border-radius:6px;padding:7px 9px;color:var(--text);font-size:12px}
/* 工作台 */
.ws{display:grid;grid-template-columns:250px 1fr 380px;min-height:720px}
.colL{background:var(--panel);border-right:1px solid var(--border);padding:14px}
.colR{background:var(--panel);border-left:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:14px}
.sect{font-size:11px;letter-spacing:1px;color:var(--muted);margin:14px 0 8px;text-transform:uppercase}
.sect:first-child{margin-top:0}
.layer{border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:8px;background:var(--base);cursor:pointer}
.layer:hover{border-color:var(--muted)}
.layer .ln{display:flex;align-items:center;gap:8px;font-size:13px}
.layer .st{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.layer.cur{border-color:var(--accent);background:rgba(224,160,74,.07)}
.layer.cur .st{background:var(--accent)}
.layer.done .st{background:var(--ok)}
.layer.lock .st{background:var(--border)}
.layer .todo{font-size:11px;color:var(--muted);margin-top:4px;padding-left:17px}
.layer.cur .todo{color:var(--accent)}
.concept{display:flex;flex-wrap:wrap;gap:6px}
.gapline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px}
.mini{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;padding:3px 0}
.colM{padding:18px 22px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.layerhead{display:flex;align-items:center;gap:12px}
.layerhead .no{background:var(--accent-dim);color:var(--accent);font-size:11px;border-radius:4px;padding:2px 8px;font-weight:700}
.layerhead .no.blue{background:rgba(111,159,201,.2);color:var(--info)}
.layerhead h2{font-size:17px}
.layerhead .sub2{color:var(--muted);font-size:12px;margin-left:auto}
.softlock{font-size:12px;color:var(--warn);background:rgba(217,161,61,.08);border:1px dashed rgba(217,161,61,.4);border-radius:8px;padding:8px 13px}
.nextbar{margin-top:auto;display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px 18px;cursor:default}
.nextbar.lit{border-color:var(--ok);background:rgba(127,176,105,.06)}
.nextbar .nx1{font-size:11px;color:var(--muted);letter-spacing:1px}
.nextbar .nx2{font-size:14px;font-weight:600}
.nextbar .grow{flex:1}
.cascade{font-size:12px;color:var(--muted);background:var(--panel);border:1px dashed var(--border);border-radius:8px;padding:10px 14px;line-height:1.7}
.cascade b{color:var(--text)}
.lineage{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.lineage .edge{background:var(--raised);border-radius:4px;padding:1px 7px}
.pcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
.pcard .ph{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:8px}
.pcard .ph .v{color:var(--muted);font-weight:400;font-size:12px}
.pcard p{font-size:13px;line-height:1.8;color:#cfccc4}
.pcard .pf{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.merge{border:1px solid var(--accent);background:rgba(224,160,74,.06)}
.pcard.ok2{border-color:rgba(127,176,105,.45)}
.proposals2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gapitem{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:8px}
.gapitem .gi{flex:1}
.gapitem .gi .t{font-size:13px}
.gapitem .gi .d{font-size:11px;color:var(--muted);margin-top:2px}
.gapitem.done2{border-color:rgba(127,176,105,.4)}
.gapitem.todo2{opacity:.62}
.gapitem .impact{font-size:11px;color:var(--ok);margin-top:3px}
.act{font-size:12px;color:var(--muted);margin:10px 0 8px;display:flex;align-items:center;gap:8px}
.act b{color:var(--text)}
.act .rule{flex:1;height:1px;background:var(--border)}
.beats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.beat{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--panel);display:flex;gap:10px;align-items:flex-start}
.beat .bn{font-size:12px;font-weight:700;color:var(--muted);background:var(--base);border-radius:6px;padding:3px 8px;flex-shrink:0}
.beat.ok{border-color:rgba(127,176,105,.45)}
.beat.ok .bn{color:var(--ok)}
.beat .bt{flex:1;font-size:12px;line-height:1.6;color:#cfccc4}
.beat .bmarks{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
.bm{font-size:10px;border-radius:4px;padding:1px 6px}
.bm.f{background:rgba(217,161,61,.15);color:var(--warn)}
.bm.d{background:rgba(201,111,95,.15);color:var(--danger)}
.bm.s{background:rgba(111,159,201,.15);color:var(--info)}
.beat .bops{display:flex;gap:5px;margin-top:7px}
.roster{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.rc{border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;background:var(--panel)}
.rc.on{border-color:var(--accent);background:rgba(224,160,74,.08);color:var(--accent)}
.rc .rs{font-size:10px;color:var(--muted);display:block;margin-top:1px}
.agroup{margin-bottom:12px}
.agroup .agn{font-size:11px;letter-spacing:1px;color:var(--accent);margin-bottom:8px}
.afields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.af{background:var(--base);border:1px solid var(--border);border-radius:8px;padding:9px 12px}
.af .k{font-size:11px;color:var(--muted);margin-bottom:3px}
.af .v{font-size:12px;line-height:1.6;color:#d8d5cd}
.arc{display:flex;gap:0;margin:8px 0 2px}
.arc .as{flex:1;position:relative;padding-top:18px;font-size:11px;color:var(--muted);text-align:center}
.arc .as::before{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:var(--accent-dim)}
.arc .as::after{content:"";position:absolute;top:1px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:var(--accent)}
.arc .as:first-child::before{left:50%} .arc .as:last-child::before{right:50%}
.relcard{display:flex;align-items:center;gap:12px;background:var(--base);border:1px solid var(--border);border-radius:8px;padding:10px 13px;margin-bottom:8px}
.relcard .rr{flex:1;font-size:12px}
.relcard .rr .rk{color:var(--muted);font-size:11px;margin-top:2px}
.pov{display:flex;flex-direction:column;gap:6px}
.povr{display:flex;align-items:center;gap:10px;font-size:12px}
.povr .pn{width:52px;color:var(--muted);flex-shrink:0}
.povr .bar{height:14px;border-radius:4px;background:var(--accent-dim)}
.scards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:12px 14px}
.scard.ok{border-color:rgba(127,176,105,.45)}
.scard .sh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:7px}
.scard .sh .sid{color:var(--accent);font-size:11px;background:var(--accent-dim);border-radius:4px;padding:1px 7px}
.scard .srow{font-size:11.5px;line-height:1.7;color:#c9c6be}
.scard .srow b{color:var(--muted);font-weight:400;margin-right:4px}
.scard .sf{display:flex;gap:6px;justify-content:flex-end;margin-top:9px}
.tracktag{font-size:10px;border-radius:4px;padding:1px 6px;background:rgba(111,159,201,.15);color:var(--info)}
.writegrid{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
.ctx{font-size:11.5px;color:var(--muted);line-height:1.9}
.ctx .ci{display:flex;gap:8px;align-items:baseline}
.ctx .ci::before{content:"·";color:var(--accent)}
.editor{border:1px solid var(--border);border-radius:10px;background:var(--panel);overflow:hidden}
.editor .ehead{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
.editor .ebody{padding:18px 20px;font-size:14px;line-height:2.1;color:#e2dfd8;min-height:220px;outline:none}
.editor .efoot{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.savedot{width:7px;height:7px;border-radius:50%;background:var(--border);display:inline-block}
.savedot.on{background:var(--warn)}
.fsline{position:relative;margin:14px 0 6px;height:58px}
.fsline .rail{position:absolute;top:24px;left:0;right:0;height:2px;background:var(--border)}
.fnode{position:absolute;top:14px;width:20px;height:20px;border-radius:50%;background:var(--panel);border:2px solid var(--warn);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--warn)}
.fnode.g{border-color:var(--ok);color:var(--ok)}
.flab{position:absolute;top:46px;font-size:10px;color:var(--muted);transform:translateX(-50%)}
.fcard{border:1px solid var(--border);border-radius:9px;padding:12px 14px;background:var(--panel);margin-bottom:10px}
.fcard .fh{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.fcard .fst{font-size:11px;border-radius:4px;padding:1px 8px}
.fcard .fst.open{background:rgba(217,161,61,.15);color:var(--warn)}
.fcard .fst.paid{background:rgba(127,176,105,.12);color:var(--ok)}
.fcard .fd{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
.audit{border:1px solid var(--border);border-radius:9px;padding:11px 13px;background:var(--panel);margin-bottom:8px;font-size:12px}
.audit .ah{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}
.audit .ab{line-height:1.7;color:#cfccc4}
.plist .pi{border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:12px}
.plist .pi .pt{display:flex;justify-content:space-between;color:var(--text)}
.plist .pi .pd{color:var(--muted);margin-top:3px;font-size:11px}
.chatbox{background:var(--base);border:1px solid var(--border);border-radius:10px;min-height:110px;padding:10px;font-size:12px;color:var(--muted)}
.chatmsg{background:var(--raised);border-radius:8px;padding:8px 10px;margin-bottom:8px;line-height:1.6;color:#cfccc4}
.chatmsg.ai{background:rgba(111,159,201,.1);border:1px solid rgba(111,159,201,.3)}
.chatinput{display:flex;gap:8px;margin-top:8px}
.chatinput input{flex:1;background:var(--raised);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--text);font-size:12px}
/* toast */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--raised);border:1px solid var(--accent);color:var(--text);padding:9px 18px;border-radius:8px;font-size:13px;box-shadow:0 10px 40px rgba(0,0,0,.6);z-index:200;display:none}
.empty-big{border:1px dashed var(--border);border-radius:12px;padding:40px 30px;text-align:center;color:var(--muted)}
.empty-big .et{font-size:16px;color:var(--text);font-weight:600;margin-bottom:8px}
</style>
</head>
<body>

<div class="dbar">
  <h1>Snowel Web 重构 · 交互 Demo</h1>
  <span class="sub">可真实操作：向导可走完 · 层可切换 · 提案/拍/缺口/场景卡可确认 · 书可切换 · 纯前端演示（刷新重置）</span>
  <span class="sp"></span>
  <div class="legend"><span><span class="dot g"></span>后端已有 API</span><span><span class="dot y"></span>后端缺口</span></div>
  <button class="dbtn" onclick="goWizard()">重看向导</button>
  <button class="dbtn" onclick="resetDemo()">重置演示</button>
</div>

<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ================= 数据 ================= */
const BEATS = [
 "凌晨 2:59 林晚猝死般惊醒，前世记忆归位",
 "3:00 强制坠入「首夜」白雾广场，数十万人影，头顶悬浮排名",
 "新手挑战「沉默房间」：濒死体质意外免疫判定，首次卡盲区|F:⚠ 埋伏笔 · 穿越者盲区",
 "首次结算：排名 48 万+，奖励「哑铃铛」（无用物品?）|F:🔔 物品伏笔 · 拍 18 回收",
 "日常崩塌开始：同事中也有被选中者",
 "【灾难一】连垫底三月，额外时间延至 5h/天，现实开始“褪色”|D:灾难一",
 "「回声长廊」结识联盟核心，垫底者抱团",
 "垫底者互赠排名碎片微量续命，联盟雏形|S:🌱 排名套利 · 种子期",
 "「殡仪馆」副本：扮演死者，全场只有他游刃有余——盲区第二次兑现|F:⚠ 盲区兑现",
 "排名入前 1 万，获能力「时滞」；现实线：濒死体验者互助会",
 "【灾难二】垫底者消失=寿命输送；最好的朋友即将垫底|D:灾难二",
 "挽救失败，朋友（陈叠）消失",

function rColR(p){
  let items=[];
  if(p.empty){
    if(p.inspSaved&&!p.premA) items.push(["前提 · 生成中…","derive_from 灵感原话","warn"]);
    if(p.premA) items.push(["前提 · 提案 A","等待你在中栏裁决 →","warn"]);
  } else {
    if(!p.premise) items.push(["前提 · A+B 合并稿","待确认","warn"]);
    if(p.layer===2&&p.sub==="beats") items.push([`节拍表 · 三幕 18 拍`,p.beats.every(Boolean)?"已确认":"部分确认中 "+p.beats.filter(Boolean).length+"/18",p.beats.every(Boolean)?"ok":"warn"]);
    if(p.layer===4) items.push(["场景卡 · 拍 1–4 拆分",(p.scenes.filter(Boolean).length)+" 确认 / 3 张","warn"]);
    if(p.layer===5&&p.proseDirty) items.push(["正文 · 1.1 草稿","未保存（编辑器内）","warn"]);
    if(p.layer===5&&p.proseSaved) items.push(["正文 · 1.1 草稿","已入队待确认","warn"]);
    if(p.layer===5) items.push(["抽取 · 67 年婚姻","待确认 · 高敏感","warn"]);
  }
  if(!items.length) items.push(["暂无待确认提案","生成或写作后出现在这里","muted"]);
  const chat=p.empty?"灵感已存档。想先聊聊设定，还是直接生成前提？":
    (p.layer===2&&p.sub==="beats"?"拍 4 的「哑铃铛」我在拍 18 安排了回收——如果你改掉拍 4 的奖励，记得让我同步结局。":
    (p.layer===5?"「湿的、咸的、不属于这里的」这句和场景卡的「错位感」意图咬得很准。要我按这个调子续写吗？":"缺口②其实影响拍 11-12（朋友消失）的写法——要我把「寿命输送」也具体化成机制吗？"));
  return `<div class="colR">
    <div class="sect" style="margin-top:0">提案队列 · ${items.length}</div>
    <div class="plist">${items.map(([t,d,c])=>`<div class="pi"><div class="pt"><span>${t}</span><span style="color:var(--${c==="ok"?"ok":c==="muted"?"muted":"warn"})">${d}</span></div></div>`).join("")}</div>
    <div class="sect">生成提案 <span class="tag q">自然语言化（修 W-8）</span></div>
    <div class="card">
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${["前提","梗概","摘要","节拍表","角色","场景","正文"].map((t,i)=>`<span class="tt ${i===0?"on":""}" style="border:1px solid var(--border);border-radius:14px;padding:3px 11px;font-size:12px;color:${i===0?"var(--accent)":"var(--muted)"};cursor:pointer;background:${i===0?"var(--accent-dim)":"transparent"}">${t}</span>`).join("")}</div>
      <div class="field" style="margin-bottom:8px"><label>附加要求（可选，说人话即可）</label><input placeholder="例：基调更黑暗一些，结局留一线希望"></div>
      <details style="font-size:12px;color:var(--muted)"><summary style="cursor:pointer">高级（定位 JSON / 原始参数）</summary>
        <div class="field" style="margin-top:8px"><label>locate（JSON）</label><input value='{"chapter":"ch1"}'></div></details>
      <div class="row" style="margin-top:10px"><button class="btn primary" onclick="toast('POST /api/generate（演示）——W-4 修复后：无 key 时这里会提示先配置')">生成提案</button></div></div>
    <div class="sect">聊天 · 助手</div>
    <div class="chatbox"><div class="chatmsg ai">${chat}</div>
      <div class="chatinput"><input placeholder="说出你的想法…（Enter 发送）"><button class="btn sm" onclick="toast('聊天：SSE /api/chat/stream（演示静态）')">发送</button></div></div>
  </div>`;
}

/* ---------- 设置弹窗 ---------- */
function rSettings(){
  return `<div class="modal ${S.settings?"on":""}" onclick="if(event.target===this)S.settings=false,render()">
    <div class="mcard"><h3>设置 · 创作引擎 <span class="tag q">配置随书存（Q2）</span></h3>
      <div class="hint">当前书「${esc(P().name)}」的模型配置。修改后立即生效。</div>
      <div class="field"><label>接入方式</label><select><option>DeepSeek</option><option>OpenAI 兼容</option><option>Anthropic</option></select></div>
      <div class="field" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>API Key</label><input type="password" value="sk-••••••••••••"></div><div><label>模型</label><select><option>deepseek-chat</option></select></div></div>
      <div class="field"><label>Base URL（可选）</label><input placeholder="https://api.deepseek.com/v1"></div>
      ${S.tested2?`<div class="testok">✓ 连接成功 · deepseek-chat</div>`:""}
      <div class="row"><button class="btn ghost" onclick="S.settings=false;render()">取消</button>
        <button class="btn ghost" onclick="S.tested2=true;render()">测试连接</button>
        <button class="btn primary" onclick="S.settings=false;toast('已保存（演示）· PUT /api/llm/config');render()">保存</button></div></div></div>`;
}

render();
</script>
</body>
</html>
