<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowvel - 雪花写作法</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="nav-brand">
                <span class="logo">❄️</span>
                <span>Snowvel</span>
            </div>
            <div class="nav-links">
                <a href="#" class="nav-link active" data-page="projects">项目</a>
                <a href="#" class="nav-link" data-page="config">配置</a>
            </div>
        </nav>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 项目列表页 -->
            <div id="page-projects" class="page active">
                <div class="page-header">
                    <h1>我的项目</h1>
                    <button class="btn btn-primary" onclick="app.showCreateProject()">+ 新建项目</button>
                </div>
                <div id="projects-list" class="projects-grid">
                    <!-- 项目卡片将在这里渲染 -->
                </div>
            </div>

            <!-- 配置页 -->
            <div id="page-config" class="page">
                <div class="page-header">
                    <h1>API 配置</h1>
                </div>
                <div class="config-form">
                    <div class="form-group">
                        <label>API 密钥</label>
                        <input type="password" id="api-key" placeholder="输入你的 Kimi API 密钥">
                        <span class="hint">密钥将被加密存储在本地</span>
                    </div>
                    <div class="form-group">
                        <label>API 地址</label>
                        <input type="text" id="api-base-url" value="https://api.moonshot.cn/v1" placeholder="https://api.moonshot.cn/v1">
                    </div>
                    <div class="form-group">
                        <label>模型</label>
                        <input type="text" id="api-model" value="kimi-k2-5" placeholder="kimi-k2-5">
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-primary" onclick="app.saveConfig()">保存配置</button>
                        <button class="btn btn-secondary" onclick="app.testConfig()">测试连接</button>
                    </div>
                    <div id="config-status" class="status-message"></div>
                </div>
            </div>

            <!-- 项目详情页 (Layer 1 & 2) -->
            <div id="page-project-detail" class="page">
                <div class="project-nav">
                    <button class="btn btn-secondary" onclick="app.showProjects()">← 返回项目列表</button>
                    <h2 id="project-title">项目标题</h2>
                </div>

                <!-- 进度指示器 -->
                <div class="progress-steps">
                    <div class="step active" data-step="1">
                        <span class="step-num">1</span>
                        <span class="step-name">灵感雪核</span>
                    </div>
                    <div class="step-arrow">→</div>
                    <div class="step" data-step="2">
                        <span class="step-num">2</span>
                        <span class="step-name">故事骨架</span>
                    </div>
                </div>

                <!-- Layer 1: 灵感雪核 -->
                <div id="layer1-panel" class="layer-panel active">
                    <h3>Layer 1: 灵感雪核</h3>
                    <p class="panel-desc">选择标签，生成一句话前提</p>

                    <div class="tag-section">
                        <h4>选择标签</h4>
                        <div id="tag-library" class="tag-library">
                            <!-- 标签库将在这里渲染 -->
                        </div>
                        <div class="selected-tags">
                            <span>已选择：</span>
                            <span id="selected-tags-list">无</span>
                        </div>
                    </div>

                    <div class="generate-section">
                        <button class="btn btn-primary" onclick="app.generatePremise()">生成前提候选</button>
                    </div>

                    <div id="premise-candidates" class="candidates-list">
                        <!-- 候选列表将在这里渲染 -->
                    </div>

                    <div class="save-section">
                        <button class="btn btn-success" onclick="app.saveLayer1()">保存并进入下一层 →</button>
                    </div>
                </div>

                <!-- Layer 2: 故事骨架 -->
                <div id="layer2-panel" class="layer-panel">
                    <h3>Layer 2: 故事骨架</h3>
                    <p class="panel-desc">基于前提生成段落摘要和大纲</p>

                    <div class="form-group">
                        <label>当前前提</label>
                        <div id="layer2-premise-display" class="premise-display"></div>
                    </div>

                    <div class="form-group">
                        <label>结局类型</label>
                        <select id="ending-type">
                            <option value="open">开放式结局</option>
                            <option value="happy">美好结局</option>
                            <option value="tragic">悲剧结局</option>
                            <option value="twist">反转结局</option>
                        </select>
                    </div>

                    <div class="generate-section">
                        <button class="btn btn-primary" onclick="app.generateSummary()">生成段落摘要</button>
                    </div>

                    <div id="summary-result" class="summary-result">
                        <!-- 摘要结果将在这里渲染 -->
                    </div>

                    <div class="generate-section">
                        <label>章节数</label>
                        <input type="number" id="chapter-count" value="20" min="10" max="40">
                        <button class="btn btn-primary" onclick="app.generateOutline()">生成大纲</button>
                    </div>

                    <div id="outline-result" class="outline-result">
                        <!-- 大纲结果将在这里渲染 -->
                    </div>

                    <div class="save-section">
                        <button class="btn btn-success" onclick="app.saveLayer2()">保存大纲</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- 新建项目弹窗 -->
        <div id="create-project-modal" class="modal">
            <div class="modal-content">
                <h3>新建项目</h3>
                <div class="form-group">
                    <label>项目名称</label>
                    <input type="text" id="new-project-name" placeholder="输入项目名称">
                </div>
                <div class="form-group">
                    <label>项目描述（可选）</label>
                    <textarea id="new-project-desc" placeholder="输入项目描述"></textarea>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="app.hideModal()">取消</button>
                    <button class="btn btn-primary" onclick="app.createProject()">创建</button>
                </div>
            </div>
        </div>

        <!-- 加载遮罩 -->
        <div id="loading" class="loading-overlay hidden">
            <div class="spinner"></div>
            <p>AI 正在创作中...</p>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
